name: Android Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Is this a pre-release?'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      packages: write  # If you're also publishing packages

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from build.gradle
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "Version found: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract latest changelog entry
        id: changelog
        run: |
          LATEST=$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {if (p) exit; p=1; next} p' CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LATEST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode the stable keystore from a base64-encoded GitHub Secret. We
      # write it to the runner workspace and hand the absolute path to the
      # Gradle build via the KEYSTORE_FILE env var. The file is auto-removed
      # at the end of the job by GitHub's ephemeral runner.
      #
      # If the secret is missing we abort with a clear message rather than
      # silently emitting an unsigned APK — the whole point of this workflow
      # is in-place updates, which require stable signing.
      - name: Materialise signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is not set. Add KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings → Secrets and variables → Actions before running this workflow." >&2
            exit 1
          fi
          mkdir -p .ci_keystore
          echo "$KEYSTORE_B64" | base64 -d > .ci_keystore/release.jks
          ls -l .ci_keystore/release.jks
          echo "KEYSTORE_FILE=$(pwd)/.ci_keystore/release.jks" >> $GITHUB_ENV

      # Build both artifacts: the AAB for Play Store submission and a signed
      # universal APK for direct sideloading / in-place updates.
      - name: Build Release AAB + APK (signed by Gradle)
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Locate signed AAB
        id: locate_aab
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "Found: $AAB"
          NEW_NAME="caelum-${{ steps.get_version.outputs.version }}.aab"
          mv "$AAB" "$NEW_NAME"
          echo "RELEASE_AAB=$NEW_NAME" >> $GITHUB_ENV

      - name: Locate signed APK
        id: locate_apk
        run: |
          # Prefer the signed APK; never ship the *-unsigned.apk fallback.
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v -- '-unsigned' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found in app/build/outputs/apk/release/." >&2
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "Found: $APK"
          NEW_NAME="caelum-${{ steps.get_version.outputs.version }}.apk"
          mv "$APK" "$NEW_NAME"
          echo "RELEASE_APK=$NEW_NAME" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            ${{ env.RELEASE_AAB }}
            ${{ env.RELEASE_APK }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
